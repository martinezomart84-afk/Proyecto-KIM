name: Compilar KIM APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extraer proyecto KIM
        run: |
          unzip -q KIM_Android_Cloud_Build*.zip -d source
          find source -name settings.gradle.kts -print

      - name: Compilar APK
        run: |
          cd source/KIM_Android_Project
          gradle --no-daemon :app:assembleDebug

      - name: Guardar KIM APK
        uses: actions/upload-artifact@v4
        with:
          name: KIM-APK
          path: source/KIM_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          
